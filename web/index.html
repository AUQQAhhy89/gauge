<!doctype html>
<html lang="zh" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e9e9e7">
  <title>Gauge</title>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("gauge-theme") || "system";
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#1b1b1a" : "#e9e9e7";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" id="brandLink" aria-label="Gauge">
      <span class="brand-name">Gauge</span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="#/" data-nav="search" class="nav-link"><span data-i18n="nav.search">搜索</span></a>
      <a href="#/saved" data-nav="saved" class="nav-link"><span data-i18n="nav.saved">收藏</span></a>
      <a href="#/web" data-nav="web" class="nav-link"><span data-i18n="nav.web">网页</span></a>
    </nav>
    <div class="top-actions">
      <button class="region-button" id="regionButton" type="button">
        <span class="region-dot" aria-hidden="true"></span>
        <span id="regionLabel">CN · CNY</span>
      </button>
      <button class="settings-button" id="settingsButton" type="button">
        <span class="settings-glyph" aria-hidden="true"></span>
        <span data-i18n="nav.settings">设置</span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="offline-banner" id="offlineBanner" hidden></div>
    <section class="view search-view" id="searchView">
      <div class="intro">
        <h1 data-i18n="search.title">搜索一款游戏</h1>
        <p class="lede" data-i18n="search.hint"></p>
      </div>

      <div class="mirror-hint" id="mirrorHint" hidden></div>
      <div class="public-ad" id="publicAd" hidden></div>

      <form class="search-box" id="searchForm" role="search">
        <label class="sr-only" for="searchInput" data-i18n="search.title">搜索游戏</label>
        <input id="searchInput" name="q" type="search" autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="search" placeholder="输入游戏名称，支持模糊搜索">
        <button type="submit" id="searchSubmit">
          <span data-i18n="search.button">搜索</span>
        </button>
      </form>

      <div class="search-status" id="searchStatus" hidden>
        <span class="status-line"></span>
        <span id="searchStatusText" data-i18n="search.loading">正在搜索</span>
      </div>

      <section class="featured" id="featuredSections" hidden></section>

      <div class="recent" id="recentSection" hidden>
        <div class="recent-block" id="recentSearchBlock">
          <div class="section-head">
            <h2 data-i18n="search.recent">最近搜索</h2>
          </div>
          <div class="recent-searches" id="recentSearches"></div>
        </div>
        <div class="recent-block" id="recentViewedBlock">
          <div class="section-head">
            <h2 data-i18n="search.recentViews">最近查看</h2>
          </div>
          <div class="recent-games" id="recentGames"></div>
        </div>
      </div>

      <div class="results-head" id="resultsHead" hidden>
        <h2 data-i18n="search.results">结果</h2>
        <span id="resultsCount"></span>
      </div>
      <div class="results-grid" id="resultsGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="empty-copy" id="emptyCopy"></p>
      </div>
    </section>

    <section class="view detail-view" id="detailView" hidden></section>
    <section class="view saved-view" id="savedView" hidden></section>
    <section class="view web-view" id="webView" hidden></section>
  </main>

  <footer class="footer">
    <span data-i18n="footer.notAffiliated">与 Valve / Steam 无关</span>
    <span class="footer-sep">/</span>
    <span data-i18n="footer.disclaimer">仅供学习与查询公开数据</span>
    <span class="footer-sep">/</span>
    <span class="footer-build" id="footerBuild">v1.4.0</span>
  </footer>

  <div id="modalRoot"></div>
  <div id="setupRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
